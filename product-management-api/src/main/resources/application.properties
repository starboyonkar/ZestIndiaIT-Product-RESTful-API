spring.application.name=product-management-api

server.port=${SERVER_PORT:8086}

# MySQL

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/product_management_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:onkar123}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

# JWT

security.jwt.secret=${JWT_SECRET:change-this-development-secret}

security.jwt.expiration=${JWT_EXPIRATION:900000}

security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# CORS

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Swagger

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html